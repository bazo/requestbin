# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: [".env", ".env.local"]
  

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - task --list-all

  server:
    desc: Start the server
    cmds:
      - air

  client:
    desc: Start the client
    dir: ui
    cmds:
      - bun run dev
